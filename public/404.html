<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
    <script>
      // GitHub project pages live under /<repo>/; user pages and custom domains at /.
      var base =
        /\.github\.io$/.test(location.hostname) && location.pathname.split("/")[1]
          ? "/" + location.pathname.split("/")[1] + "/"
          : "/";
      if (location.pathname !== base) location.replace(base + location.search);
    </script>
  </head>
  <body>
    <p>Page not found. <a href="./">Go to Wi-Fi setup</a></p>
  </body>
</html>
